#==============================================================================
#  InspireB — configuration Cloudflare Workers
#------------------------------------------------------------------------------
#  Cloudflare a fusionné Pages dans Workers : le site est désormais déployé
#  comme un Worker qui sert les fichiers statiques générés par Astro.
#
#  Commande de build       : npm run build      (génère le dossier dist)
#  Commande de déploiement : npx wrangler deploy
#
#  ⚠️ Dès qu'un wrangler.toml existe, Cloudflare l'utilise À LA PLACE des
#     réglages du tableau de bord. Si tu ajoutes une variable depuis
#     l'interface Cloudflare, pense à l'inscrire aussi ici.
#==============================================================================

name = "inspireb"
main = "src/worker.js"
compatibility_date = "2026-01-01"

#------------------------------------------------------------------------------
#  Fichiers statiques : tout le site généré par Astro
#------------------------------------------------------------------------------
#  Cloudflare sert d'abord les fichiers de "dist". Seules les URL qui ne
#  correspondent à aucun fichier (comme /api/contact) atteignent le Worker.
#------------------------------------------------------------------------------
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"

#------------------------------------------------------------------------------
#  Envoi d'e-mail — formulaire de contact
#------------------------------------------------------------------------------
#  ⚠️ CETTE SECTION EST DÉSACTIVÉE POUR L'INSTANT.
#
#  Le site se déploie très bien sans elle : le formulaire est de toute façon
#  masqué (FORMULAIRE_ACTIF = false dans src/pages/contact.astro).
#
#  Pour l'activer plus tard :
#   1. Cloudflare → Email → Email Routing → vérifier inspirebettyn@gmail.com
#   2. retirer les # des trois lignes ci-dessous
#   3. passer FORMULAIRE_ACTIF à true dans src/pages/contact.astro
#   4. git push
#
#  Si le déploiement échoue après avoir retiré les #, c'est que l'envoi
#  d'e-mail n'est pas disponible sur ce compte : remets les # et dis-le moi.
#------------------------------------------------------------------------------
# [[send_email]]
# name = "EMAIL"
# destination_address = "inspirebettyn@gmail.com"
